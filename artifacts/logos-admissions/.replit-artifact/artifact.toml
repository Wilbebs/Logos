kind = "web"
previewPath = "/"
title = "LOGOS Admissions"
version = "1.0.0"
id = "artifacts/logos-admissions"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20263

[services.development]
run = "pnpm --filter @workspace/logos-admissions run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/logos-admissions", "run", "build" ]
publicDir = "artifacts/logos-admissions/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20263"
BASE_PATH = "/"
